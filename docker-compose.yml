
services:
  postgres:
    image: postgis/postgis:18-master
    container_name: centinela-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-centinela_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:alpine
    container_name: centinela-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: centinela-mqtt
    ports:
      - "1883:1883"
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"

  c-gateway:
    build:
      context: ./c-gateway
    container_name: centinela-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NATS_SERVICE=nats://nats:4222
      - JWT_SERVICE=${JWT_SECRET:-super-secret-key}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_FOLDER=${CLOUDINARY_FOLDER:-centinela}
      - APP_RESET_URL=${APP_RESET_URL:-centinela://reset-password}
      - ANDROID_APP_PACKAGE=${ANDROID_APP_PACKAGE:-com.example.centinela_milagro}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://localhost:3000}
    depends_on:
      nats:
        condition: service_healthy

  ms-auth:
    build:
      context: ./ms-auth
    container_name: centinela-ms-auth
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-centinela_db}?schema=public
      - NATS_SERVICE=nats://nats:4222
      - JWT_SERVICE=${JWT_SECRET:-super-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  ms-core:
    build:
      context: ./ms-core
    container_name: centinela-ms-core
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-centinela_db}?schema=public
      - NATS_SERVICE=nats://nats:4222
      - PORT=3001
      - ALERT_DEDUP_WINDOW_SEC=${ALERT_DEDUP_WINDOW_SEC:-60}
      - ALERT_SINGLE_NODE_BYPASS=${ALERT_SINGLE_NODE_BYPASS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
    container_name: centinela-ms-notificaciones
    environment:
      - NATS_SERVICE=nats://nats:4222
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID:-}
      - ONESIGNAL_REST_API_KEY=${ONESIGNAL_REST_API_KEY:-}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/secrets/firebase-service-account.json
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3001}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-http://localhost:3001}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3000}
      - APP_RESET_URL=${APP_RESET_URL:-centinela://reset-password}
      - ANDROID_APP_PACKAGE=${ANDROID_APP_PACKAGE:-com.example.centinela_milagro}
    volumes:
      - ./ms-notificaciones/secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    depends_on:
      nats:
        condition: service_healthy

  ms-ia:
    build:
      context: ./ms-ia
    container_name: centinela-ms-ia
    environment:
      - NATS_SERVICE=nats://nats:4222
      - BRIDGE_ROOT=/ms-IoT-Bridge
    volumes:
      - shared_audio:/ms-IoT-Bridge/data/audio
    depends_on:
      nats:
        condition: service_healthy

  ms-iot-bridge:
    build:
      context: ./ms-IoT-Bridge
    container_name: centinela-ms-iot-bridge
    environment:
      - NATS_SERVICE=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-centinela_db}
      - MQTT_HOST=mqtt
    volumes:
      - shared_audio:/app/data/audio
    depends_on:
      nats:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  postgres_data:
  shared_audio:
