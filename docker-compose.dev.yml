# Desarrollo: monta el código fuente y evita rebuild por cada cambio .ts
#
# Primera vez (o cuando cambie package.json / package-lock.json):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build ms-auth c-gateway
#
# Día a día — solo cambios .ts (SIN --build, arranca en segundos):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d ms-auth c-gateway
#
# Si agregaste dependencias npm localmente, reconstruye solo ese servicio:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml build ms-auth
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d ms-auth

services:
  c-gateway:
    volumes:
      - ./c-gateway:/app
      - c_gateway_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  ms-auth:
    volumes:
      - ./ms-auth:/app
      - ms_auth_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  ms-core:
    volumes:
      - ./ms-core:/app
      - ms_core_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  ms-notificaciones:
    volumes:
      - ./ms-notificaciones:/app
      - ms_notificaciones_node_modules:/app/node_modules
      - ./ms-notificaciones/secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  c_gateway_node_modules:
  ms_auth_node_modules:
  ms_core_node_modules:
  ms_notificaciones_node_modules:
